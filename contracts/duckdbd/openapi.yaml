          }
        },
        "description": "Immutable Core-held record of completed canonical publication plus verified repositoryd readback. Pending, failed, uncertain or missing publication is not eligible. A status string and digest are assertions, not proof: authenticate the Core authority and verify the protected grant binding and the exact record/result digest relations before mutation. No raw storage locator or outbound readback instruction is carried."
      }
