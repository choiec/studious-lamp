            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "operation": {
            "type": "string",
            "enum": [
              "publish_product_object"
            ]
          },
          "request_binding_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "status": {
            "type": "string",
            "const": "SUCCEEDED"
          },
          "reason_code": {
            "type": "string",
            "const": "COMPLETED"
          },
          "result": {
            "$ref": "#/components/schemas/Result"
          },
          "result_sha256": {
            "$ref": "#/components/schemas/Sha256"
          }
        }
      },
      "Failed": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "effect_id",
          "idempotency_key",
          "operation",
          "request_binding_sha256",
          "status",
          "reason_code"
        ],
        "properties": {
          "effect_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "operation": {
            "type": "string",
            "enum": [
              "publish_product_object"
            ]
          },
          "request_binding_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "status": {
            "type": "string",
            "const": "FAILED"
          },
          "reason_code": {
            "type": "string",
            "enum": [
              "PREREQUISITE_MISMATCH",
              "INPUT_DIGEST_MISMATCH",
              "IMMUTABLE_CONFLICT",
              "STORAGE_FAILED"
            ]
          }
        }
      },
      "Uncertain": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "effect_id",
          "idempotency_key",
          "operation",
          "request_binding_sha256",
          "status",
          "reason_code"
        ],
        "properties": {
          "effect_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "operation": {
            "type": "string",
            "enum": [
              "publish_product_object"
            ]
          },
          "request_binding_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "status": {
            "type": "string",
            "const": "UNCERTAIN"
          },
          "reason_code": {
            "type": "string",
            "const": "RECONCILIATION_REQUIRED"
          }
        }
      },
      "Denied": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "reason_code"
        ],
        "properties": {
          "status": {
            "type": "string",
            "const": "NOT_ATTEMPTED"
          },
          "reason_code": {
            "type": "string",
            "enum": [
              "INVALID_REQUEST",
              "REQUEST_TOO_LARGE",
              "UNSUPPORTED_MEDIA_TYPE",
              "UNAUTHENTICATED",
              "FORBIDDEN",
              "CONTEXT_MISMATCH",
              "POLICY_MISMATCH",
              "IDEMPOTENCY_CONFLICT",
              "PREREQUISITE_MISMATCH",
              "INPUT_DIGEST_MISMATCH",
              "IMMUTABLE_CONFLICT",
              "UNAVAILABLE"
            ]
          }
        }
      },
      "MissingRecord": {
