  "components": {
    "securitySchemes": {
      "CoreServiceMTLS": {
        "type": "mutualTLS",
        "description": "TLS 1.3 mutually verified Core service certificate plus independent exact operation/product authorization; protected deployment bindings not included."
      }
    },
    "schemas": {
      "StableId": {
        "type": "string",
        "minLength": 1,
        "maxLength": 128,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}(?![\\s\\S])",
        "not": {
          "anyOf": [
            {
              "pattern": "^(?:[Ll][Aa][Tt][Ee][Ss][Tt]|[Mm][Aa][Ii][Nn]|[Mm][Aa][Ss][Tt][Ee][Rr]|[Hh][Ee][Aa][Dd]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt]|[Ss][Tt][Aa][Bb][Ll][Ee]|[Dd][Ee][Ff][Aa][Uu][Ll][Tt])(?![\\s\\S])"
            },
            {
              "pattern": "\\.\\."
            }
          ]
        },
        "description": "Opaque, case-sensitive stable identity; never a path, URL, principal, secret or authority. No decoding, trimming, case folding, alias or mutable-selector resolution. Issuer stability and resource ownership require runtime verification."
      },
      "Sha256": {
        "type": "string",
        "minLength": 64,
        "maxLength": 64,
        "pattern": "^[0-9a-f]{64}(?![\\s\\S])"
      },
      "CoreRecord": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "admission_record_id",
          "admission_record_sha256",
          "snapshot_id",
          "snapshot_sha256",
          "product_id",
          "identity_record_id",
          "identity_record_sha256"
        ],
        "properties": {
          "admission_record_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "admission_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "snapshot_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "snapshot_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "product_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "identity_record_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "identity_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          }
        },
        "description": "Core-owned accepted-admission/snapshot and separately assigned product identity references; no Candidate intake locator or authority. Service checks consistency with the authenticated Core request and immutable local bindings. Candidate ID is never a substitute product identity."
      },
      "AdoptRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "effect_id",
          "idempotency_key",
          "authenticated_request_context_id",
          "policy_revision",
          "core_record",
          "core_record_sha256",
          "operation",
          "publication_record",
          "publication_record_sha256"
        ],
        "properties": {
          "effect_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "authenticated_request_context_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "policy_revision": {
            "$ref": "#/components/schemas/StableId"
          },
          "core_record": {
            "$ref": "#/components/schemas/CoreRecord"
          },
          "core_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "operation": {
            "type": "string",
            "const": "adopt_product"
          },
          "publication_record": {
            "$ref": "#/components/schemas/CanonicalPublicationRecord"
          },
          "publication_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          }
        }
      },
      "ProjectionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "effect_id",
          "idempotency_key",
          "authenticated_request_context_id",
          "policy_revision",
          "core_record",
          "core_record_sha256",
          "operation",
          "adoption_effect_id",
          "adoption_result_sha256",
          "expected_projection_revision",
          "publication_record",
          "publication_record_sha256"
        ],
        "properties": {
          "effect_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "authenticated_request_context_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "policy_revision": {
            "$ref": "#/components/schemas/StableId"
          },
          "core_record": {
            "$ref": "#/components/schemas/CoreRecord"
          },
          "core_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "operation": {
            "type": "string",
            "const": "update_projection"
          },
          "adoption_effect_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "adoption_result_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "expected_projection_revision": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740990
          },
          "publication_record": {
            "$ref": "#/components/schemas/CanonicalPublicationRecord"
          },
          "publication_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          }
        }
      },
      "Result": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "product_id",
          "core_record_sha256",
          "state_revision",
          "publication_record_sha256"
        ],
        "properties": {
          "product_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "core_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "state_revision": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "publication_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          }
        }
      },
      "Succeeded": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "effect_id",
          "idempotency_key",
          "operation",
          "request_binding_sha256",
          "status",
          "reason_code",
          "result",
          "result_sha256"
        ],
        "properties": {
          "effect_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "operation": {
            "type": "string",
            "enum": [
              "adopt_product",
              "update_projection"
            ]
          },
          "request_binding_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "status": {
            "type": "string",
            "const": "SUCCEEDED"
          },
          "reason_code": {
            "type": "string",
            "const": "COMPLETED"
          },
          "result": {
            "$ref": "#/components/schemas/Result"
          },
          "result_sha256": {
            "$ref": "#/components/schemas/Sha256"
          }
        }
      },
      "Failed": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "effect_id",
          "idempotency_key",
          "operation",
          "request_binding_sha256",
          "status",
          "reason_code"
        ],
        "properties": {
          "effect_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "operation": {
            "type": "string",
            "enum": [
              "adopt_product",
              "update_projection"
            ]
          },
          "request_binding_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "status": {
            "type": "string",
            "const": "FAILED"
          },
          "reason_code": {
            "type": "string",
            "enum": [
              "PREREQUISITE_MISMATCH",
              "INPUT_DIGEST_MISMATCH",
              "IMMUTABLE_CONFLICT",
              "STORAGE_FAILED"
            ]
          }
        }
      },
      "Uncertain": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "effect_id",
          "idempotency_key",
          "operation",
          "request_binding_sha256",
          "status",
          "reason_code"
        ],
        "properties": {
          "effect_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "operation": {
            "type": "string",
            "enum": [
              "adopt_product",
              "update_projection"
            ]
          },
          "request_binding_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "status": {
            "type": "string",
            "const": "UNCERTAIN"
          },
          "reason_code": {
            "type": "string",
            "const": "RECONCILIATION_REQUIRED"
          }
        }
      },
      "Denied": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "reason_code"
        ],
