  "x-publication-prerequisite": {
    "authority": "ProductIdentity + completed CanonicalPublication is required for adoption; ProductStateRecord + the same CanonicalPublication is required for projection (specs/001-product-runtime/data-model.md Relationships and Ownership). Independent effects do not erase these prerequisites. Neither operation requests publication or calls repositoryd.",
    "core_preparation": "Before its separate authorized adoption/projection request, Core resolves its immutable canonical-publication record backed by successful repositoryd owner-interface readback. Bind the exact source snapshot, assigned product, request binding, publication result and readback evidence. Uncertain publication must be reconciled by Core through repositoryd in that prior effect, never inside duckdbd; absent/failed/unresolved evidence blocks dispatch.",
    "verification": "duckdbd recomputes publication_record_sha256 from RFC 8785 JCS of publication_record and result_sha256 from RFC 8785 JCS of publication_record.result. Require status SUCCEEDED, publication_record.result.product_id == core_record.product_id and publication_record.result.core_record_sha256 == core_record_sha256. The latter binds accepted admission, snapshot and assigned identity together. Match publication record/result/readback-evidence digests and Core record digest to the current service-local protected grant for the authenticated Core peer, operation and product. No caller-supplied successful status, opaque ID or digest proves publication without that trusted Core binding. A missing/unverifiable grant or evidence binding fails closed before mutation.",
    "recording": "For a new adoption, store the exact immutable Core publication record/digest with the adoption result. For a new projection, require its publication_record_sha256 to equal the successful adoption retained value, matching CoreRecord and adoption_effect_id/adoption_result_sha256 for that product. Check these mutable owner-state prerequisites and projection CAS atomically only on new dispatch. Exact retained replay verifies original record/digests and returns/reconciles that result without reapplying the old CAS or testing whether today state would permit a new dispatch.",
    "replay": "Both publication fields and all nested result/readback evidence participate in the full request binding. Changed prerequisite under an existing effect/key is IDEMPOTENCY_CONFLICT, never a second mutation. Readback verifies the stored publication binding along with state and outcome without contacting repositoryd or oCIS."
  }
