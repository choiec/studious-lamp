    "description": "Separate internal Studious service boundary. Source selection only; no live binding, runtime, publication or deployment is established. All paths are relative, internal-only and inaccessible to public clients or Automatic."
  },
  "x-contract-identity": {
    "name": "repositoryd",
    "version": "0.1.0",
    "identity": "urn:studious-lamp:repositoryd:0.1.0",
    "public_core_release_inclusion": "EXCLUDED",
    "candidate_content_release_inclusion": "EXCLUDED",
    "selection": "Independent initial internal API version, not a shared release/version train or a consumer pin to Candidate content. No internal release tag/publication is selected by T011."
  },
  "security": [
    {
      "CoreServiceMTLS": []
    }
  ],
  "x-wire": {
    "http": "HTTP/1.1 (RFC 9110 semantics; RFC 9112 framing)",
    "tls": "TLS 1.3 with mutual certificate verification, hostname verification and service-specific peer authorization; never forwarded identity headers",
    "media_type": "application/json",
    "max_request_bytes": 90000000,
    "max_response_bytes": 16384,
    "max_header_bytes": 16384,
    "max_json_depth": 8,
    "encoding": "Strict UTF-8 RFC 8259 JSON; no BOM, duplicate members, nonfinite numbers, lone surrogates, trailing content, unknown fields, query parameters or content coding. Reject ambiguous HTTP framing/duplicate security headers. Bound actual streamed bytes before parse/auth/dispatch."
  },
  "x-trust": "Authenticate a distinct approved Core local service peer through TLS 1.3 mTLS, using a protected service-specific trust binding; validate chain, clientAuth/serverAuth usage, expected peer, expiry and revocation. No anonymous mode. TLS failure closes the connection before HTTP/storage. HTTP 403 covers invalid application context or denied authority after a verified TLS channel; there is no HTTP challenge scheme or TLS-to-HTTP fallback. Resolve authenticated_request_context_id to that peer and a current Core-authorized effect; independently apply this service operation/product policy and exact policy_revision. Caller-supplied context, policy ID, digest or CoreRecord is not proof of authorization. Never accept an oCIS credential, user, forwarded principal or Handoff. Exact certificates, identities, trust roots and endpoints remain protected unestablished bindings; inability to verify fails closed. Context and grant resolution uses service-local protected authorization state bound to the authenticated peer, operation, product and policy revision, never an outbound Core lookup or an unverified body assertion.",
  "x-order": [
    "1. Establish verified mTLS; enforce HTTP/JSON bounds and syntax before any storage mutation.",
    "2. Independently authenticate/allowlist Core peer and resolve current context; body handles never grant authority.",
    "3. Validate immutable request shape, recompute all input/JCS digests and immutable in-request equality. Do not evaluate mutable new-dispatch prerequisites or projection revision here.",
    "4. Look up durable effect_id/idempotency_key binding in this authenticated peer namespace. Compare the full retained request binding; changed key pairing, operation, policy or bytes conflicts without overwriting the record. Do not disclose original results yet.",
    "5. Independently authorize the exact operation/product or readback under current service policy and verify the protected Core grant. Denial performs no new storage effect and does not disclose the retained result.",
    "6. On an exact retained binding, return the independently read-back original terminal outcome or reconcile UNCERTAIN/in-progress state. Never re-evaluate old mutable prerequisites, reapply projection CAS, increment revision, reserve a new effect, or execute mutation for an exact replay.",
    "7. Only for a new effect, atomically reserve the durable binding and check all new-dispatch prerequisites in the owning transaction/critical section, preventing concurrent key/product races. Enforce immutable product binding and verify exact Core snapshot/identity input; never overwrite canonical bytes.",
    "8. Execute only this new requested owner effect. Durably commit state and outcome together or retain explicit uncertainty. Independently read back stored bytes/records and result digest before SUCCEEDED; no other effect follows."
  ],
  "x-idempotency": {
    "identity": "One-to-one effect_id and idempotency_key per authenticated Core peer namespace, scoped to this service; operation remains in binding so key reuse across operations conflicts.",
    "request_binding_sha256": "SHA-256 of RFC 8785 JCS of the full request except effect_id, idempotency_key and authenticated_request_context_id. Includes operation, policy_revision, exact Core prerequisites and all requested bytes/digests. Recompute at the service; no caller-provided replay verdict.",
    "result_sha256": "SHA-256 of RFC 8785 JCS of Result after independent owner-storage readback. Compare full input binding on replay; digest alone is not authorization.",
    "uncertainty": "Any lost/ambiguous response after dispatch is UNCERTAIN, even without a parseable response. Core must use this service GET operation readback before retry. A missing record, partition, stale replica or timeout does not establish failure/no effect. Reconcile durably to original terminal outcome or verified absence with no pending writer before retrying the same binding. No retry with a new key to evade uncertainty, rollback claim, direct storage access or cross-service compensation.",
    "retention": "Keep outcome/binding or conflict tombstone for the lifetime of retained product/state records across retry/restart/recovery. Never expire keys into accidental re-execution; policy/binding changes need a separate authorized new effect.",
    "exact_replay_before_mutable_prerequisites": "After current authentication and independent operation/resource authorization, an exact retained binding returns/reconciles the original read-back outcome before any new-dispatch prerequisite or publication write. Never write again or use a new key to evade uncertainty."
  },
  "x-effect-separation": "Only repositoryd accesses its own storage. No Handoff intake, oCIS read/credential/path, public operation, Automatic caller, storage locator, cross-service call, shared writer or direct Core storage fallback. No operation triggers identity, publication, adoption or projection at any other boundary. An absent request remains NOT_ATTEMPTED; each service success/failure/uncertain outcome remains independent. Error/readback bodies expose only bounded IDs/digests/status, never bytes, private profiles, raw provenance, secrets or storage locations.",
  "x-owner-semantics": "repositoryd alone writes canonical immutable product objects. Core pushes exact product bytes derived from its accepted snapshot with separately assigned product identity. Verify decoded size/SHA-256 and supplied Core record digest before dispatch; persist product_id -> exact bytes/digest/Core binding without overwrite. A different binding under an already bound product_id is IMMUTABLE_CONFLICT, even under a new key. No URLs or storage paths are accepted or followed; service performs no outbound source fetch and never invokes duckdbd. A success requires readback of exact bytes plus durable operation record. Core snapshot custody and publication remain separate records.",
  "x-evidence-limit": "Normative contract only. Authentication, independent authorization, byte verification, sole-writer/opener, durable idempotency, storage readback and reconciliation are future T022-T025 implementations, NOT RUN by T011. Structural conformance and synthetic fixtures are not runtime enforcement. All x-* fields are normative owner requirements except explicitly scoped evidence/status statements; extensions must be implemented independently of OpenAPI structural validation.",
  "paths": {
    "/internal/repositoryd/0.1.0/publications": {
      "post": {
        "operationId": "publish_product_object",
        "summary": "publish product object",
        "description": "One independently authorized and idempotently recorded effect only. No other effect is created on success, failure or uncertainty.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PublishRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "SUCCEEDED only after durable commit and exact owner readback; exact replay returns same result.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Succeeded"
                    },
                    {
                      "properties": {
                        "operation": {
                          "const": "publish_product_object"
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "202": {
            "description": "UNCERTAIN: reconcile through this service before retry; never success.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Uncertain"
                    },
                    {
                      "properties": {
                        "operation": {
                          "const": "publish_product_object"
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "500": {
            "description": "STORAGE_FAILED only with a definitive failed outcome and known no committed requested effect. Otherwise UNCERTAIN.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "allOf": [
                        {
                          "$ref": "#/components/schemas/Failed"
                        },
                        {
                          "properties": {
                            "reason_code": {
                              "enum": [
                                "STORAGE_FAILED"
                              ]
                            }
                          }
                        }
                      ]
                    },
                    {
                      "properties": {
                        "operation": {
                          "const": "publish_product_object"
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
