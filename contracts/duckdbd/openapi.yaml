        "description": "Exact completed canonical-publication result retained by Core after repositoryd readback. Matches repositoryd 0.1.0 Result semantics without a cross-service schema reference or call. Core must independently verify these bytes/digests before making the separate adoption/projection request."
      },
      "CanonicalPublicationRecord": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "publication_record_id",
