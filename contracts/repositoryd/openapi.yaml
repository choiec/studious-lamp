            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Denied"
                    },
                    {
                      "properties": {
                        "reason_code": {
                          "enum": [
                            "REQUEST_TOO_LARGE"
                          ]
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "415": {
            "description": "UNSUPPORTED_MEDIA_TYPE: require uncompressed UTF-8 application/json.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Denied"
                    },
                    {
                      "properties": {
                        "reason_code": {
                          "enum": [
