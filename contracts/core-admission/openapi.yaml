{
  "openapi": "3.1.1",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "Studious Core Admission API",
    "version": "0.2.0",
    "license": {
      "name": "Apache-2.0",
      "identifier": "Apache-2.0"
    },
    "description": "T011 normative source only. Admit one independently verified Candidate into Core snapshot custody. No implicit identity assignment, canonical publication, adoption or projection. Relative paths describe a contract, not a live server, published release or deployed route. No other delivery or lifecycle endpoint is introduced here."
  },
  "x-release": {
    "name": "core-admission",
    "release_id": "core-admission-0.2.0",
    "version": "0.2.0",
    "tag_target": "core-admission-v0.2.0",
    "selection_rationale": "Independent first control-plane contract cut at 0.2.0, selected by Studious T011; neither derived from Candidate-content 0.1.0 nor a compatibility claim. Only this exact version is accepted; no negotiation, alias or legacy reader.",
    "status": {
      "source_selection": "PASS",
      "local_candidate": "NOT RUN",
      "tag_creation": "NOT RUN",
      "publication": "NOT RUN",
      "remote_readback": "NOT RUN",
      "immutable_locator": "UNESTABLISHED"
    },
    "output_root": "build/releases/core-admission",
    "normative_artifacts": [
      {
        "path": "openapi.yaml",
        "source": "contracts/core-admission/openapi.yaml",
        "media_type": "application/vnd.oai.openapi+json"
      },
      {
        "path": "handoff-reference.schema.json",
        "source": "contracts/core-admission/handoff-reference.schema.json",
        "media_type": "application/schema+json"
      }
    ],
    "evidence_artifacts": [
      {
        "path": "conformance/positive.json",
        "source": "contracts/core-admission/conformance/positive.json",
        "role": "complete frozen positive vectors; synthetic identities remain synthetic"
      },
      {
        "path": "conformance/negative.json",
        "source": "contracts/core-admission/conformance/negative.json",
        "role": "complete frozen negative vectors; future runtime obligations remain unexecuted"
      },
      {
        "path": "manifest.json",
        "role": "independent identity, exactly two normative artifact sizes/digests, conformance bindings and declared distribution inventory"
      },
      {
        "path": "provenance.json",
        "role": "exact clean owner revision, raw source mode/path/hash inventory, source_tree_sha256, build/tool locks, manifest and output digests; no unverified reproducibility claim"
      },
      {
        "path": "checksums.sha256",
        "role": "SHA-256 of every other distributable file, exactly seven records; never self-hash"
      }
    ],
    "license_artifacts": [
      {
        "path": "LICENSE",
        "source": "LICENSE",
        "role": "exact tracked Apache-2.0 bytes"
      }
    ],
    "distributable_inventory": [
      "LICENSE",
      "checksums.sha256",
      "conformance/negative.json",
      "conformance/positive.json",
      "handoff-reference.schema.json",
      "manifest.json",
      "openapi.yaml",
      "provenance.json"
    ],
    "excluded_internal_sources": [
      "contracts/repositoryd/openapi.yaml",
      "contracts/duckdbd/openapi.yaml"
    ],
    "serialization": "All released JSON, including JSON-compatible openapi.yaml, is UTF-8 RFC 8785 JCS, no BOM or trailing LF; source indentation is not a release byte identity. LICENSE remains exact tracked bytes. checksums.sha256 uses sorted unsigned UTF-8 relative names and lowercase SHA-256, two spaces, LF. No outputs generated by T011.",
    "binding_order": "raw tracked sources -> normative artifacts and complete conformance -> manifest -> provenance -> checksums. No recursive artifact, manifest/provenance, or checksum hash cycle; manifest names downstream provenance without hashing it. T012 owns exact build inputs and tooling, T013 owns complete inventory generation and candidate evidence.",
    "isolation": "No Candidate-content schema, manifest, provenance, checksum, version, tag or alias is bundled. Internal repositoryd and duckdbd APIs have their own owner contract identities and are excluded from all public Core distributable inventories and normative counts. Future candidate requires tracked licensing/distribution review and byte-identical second clean environment verification; publication/readback/consumer activation remain separately gated."
  },
  "x-wire": {
    "http": "HTTP/1.1 (RFC 9110 semantics; RFC 9112 framing)",
    "tls": "TLS 1.3 (RFC 8446), certificate and hostname verification required on every hop; no insecure switch or credential forwarding trust",
    "media_type": "application/json",
    "encoding": "UTF-8 RFC 8259; reject BOM, duplicate object members at every level, nonfinite numbers, lone surrogates, trailing content and unknown fields. No content coding; reject non-identity Content-Encoding. Reject ambiguous Content-Length/Transfer-Encoding and duplicate security headers. No query parameters on these routes.",
    "max_request_bytes": 16384,
    "max_response_bytes": 16384,
    "max_header_bytes": 16384,
    "max_json_depth": 8,
    "max_manifest_bytes": 16777216,
    "max_payload_bytes": 16777216,
    "max_candidate_bytes": 67108864,
    "max_candidate_objects": 4096,
    "bounds_semantics": "Inclusive limits; Candidate aggregate includes manifest plus every payload, object count includes the manifest. Stream with independent actual byte/count caps, never trust declared size or decompress to evade limits. Exceeding any intake bound is INVENTORY_INVALID or BYTE_MISMATCH; deny acceptance. These are admission safety caps, not tested performance capacities."
  },
  "security": [
    {
      "CoreBearer": []
    }
  ],
  "x-authentication": "Exactly one Authorization: Bearer token using RFC 6750 header syntax, 1..4096 token characters, opaque Core-issued credential. No query/body/cookie token. Core validates its protected credential record, audience core-admission, expiration, revocation and caller binding independently; no JWT decode-only acceptance or caller-supplied principal. Ingress assertions, oCIS login/ACL/owner, Handoff values and context handles are never authority. A fresh authentication/context check and current operation/resource authorization are mandatory on every submission, replay and readback. Credential issuance/storage/live endpoints are not established by this contract.",
  "x-admission-order": [
    "1. Enforce request bounds and strict JSON syntax without any intake or product service access.",
    "2. Independently authenticate the Core caller; resolve and bind authenticated_request_context_id to that caller.",
    "3. Validate exact Handoff shape/version and digest against independently verified public Core pins. Require request expected Candidate/release/manifest equality with Handoff; compare Candidate-content release ID/manifest hash to independent Core pins. No network contract resolution.",
    "4. Bind submission/idempotency identity and semantic request digest with the pinned Core policy revision. Detect conflict before any new retrieval/mutation; do not release an original result before step 5.",
    "5. Authorize admit_candidate for exact environment, Space, manifest resource and Candidate under Core policy. Denial terminates with retrieval and all later effects NOT_ATTEMPTED.",
    "6. Resolve approved stable identities via the independent Studious intake reader. Conditionally retrieve exact manifest under mandatory strong version/readback evidence; reject if supported strong conditional reads cannot be established. No path, sync folder, redirect, unconditional read or latest-version fallback.",
    "7. Recompute manifest size/SHA-256 and compare request, Handoff and remote readback; validate exact independently pinned four Candidate schemas. Enumerate full Candidate scope, reject missing/extra/duplicate/unsafe/escaping/unknown objects, retrieve every declared byte and recompute sizes/SHA-256 under all caps.",
    "8. Independently validate content/disclosure rules and Resource/segment/part/option/slot/token/response/overlay integrity. Re-enumerate complete scope and conditionally re-read manifest under the same version; reject any inventory/version/size/digest mutation.",
    "9. Map validated wire DTOs to owner-local models; producer assertions and synthetic fixture booleans never replace verification.",
    "10. Persist exact verified bytes, normalized inventory, pins and verification evidence in an immutable durable Core snapshot; read back and revalidate all identities and digests.",
    "11. Record admission decision against that snapshot only. No later effect, auto-submit, product identity or downstream service invocation is implied."
  ],
  "x-idempotency": {
    "identity": "Core-authenticated caller namespace with one-to-one submission_id and idempotency_key binding. Reusing either with a different partner or semantic binding is conflict. No principal is serialized in Handoff.",
    "request_binding_sha256": "SHA-256 of RFC 8785 JCS object containing operation, handoff_reference, expected_candidate_id, expected_candidate_manifest_sha256, expected_candidate_contract_release_id and Core-selected policy_revision. All reference/precondition fields bind. requested_at and refreshed authenticated_request_context_id are not semantic replay inputs; fresh auth still required.",
    "replay": "Atomically reserve one binding in durable Core records before intake, only after authorization; concurrent exact requests return or reconcile the same outcome, never execute twice. Exact accepted replay uses Core snapshot/records without oCIS access. Conflicts never mutate or overwrite the original binding. Policy change conflicts with the old key; new request needs new identities and authorization.",
    "uncertainty": "After dispatch/timeout/lost response, record UNCERTAIN; use authenticated GET submission readback before retry. Return original terminal result only after independently verified Core record/snapshot readback. NOT_FOUND, timeout or unavailable authority never proves no effect; do not retry until authoritative reconciliation establishes either the existing outcome or durable absence with no pending writer. Do not expire/reuse keys to erase uncertainty.",
    "retention": "Keep durable bindings/outcomes and conflict tombstones for the lifetime of retained admission/snapshot records, across retry/restart/recovery. No TTL-based key reuse or post-admission oCIS access."
  },
  "x-evidence-limit": "The source schema checks shape/version only. Actual pin/digest equality, authentication, authorization, conditional intake, mapping, replay store, durable snapshot readback and reconciliation remain future Core use cases (T015+), NOT RUN here. T010 is a finite static oracle, not full standards validation or runtime evidence. Exactly one remotely usable oCIS user gives no Automatic/Core principal isolation. All x-* fields in this document express normative owner requirements except explicitly scoped evidence/status statements; an OpenAPI tool may ignore extensions, so later delivery/use cases must enforce them. Safety caps are inclusive application constraints, not guarantees from the shape evaluator.",
  "paths": {
    "/core-admission/0.2.0/admissions": {
      "post": {
        "operationId": "admit_candidate",
        "summary": "Admit one verified Candidate snapshot",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AdmissionRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "ACCEPTED only after durable snapshot readback, including exact accepted replay.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AcceptedAdmission"
                }
              }
            }
          },
          "202": {
            "description": "UNCERTAIN: operation may have started; reconcile this submission before retry. Never an admission success.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UncertainAdmission"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/HTTP400"
          },
          "401": {
            "$ref": "#/components/responses/HTTP401"
          },
          "403": {
            "$ref": "#/components/responses/HTTP403"
          },
          "409": {
            "description": "IDEMPOTENCY_CONFLICT: changed submission/key binding. No new retrieval or mutation; do not overwrite or expose the original outcome.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/RejectedAdmission"
                    },
                    {
                      "properties": {
                        "reason_code": {
                          "enum": [
                            "IDEMPOTENCY_CONFLICT"
                          ]
                        },
                        "retrieval": {
                          "const": "NOT_ATTEMPTED"
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "413": {
            "description": "REQUEST_TOO_LARGE: serialized request limit exceeded before authentication/intake.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/RejectedAdmission"
                    },
                    {
                      "properties": {
                        "reason_code": {
                          "enum": [
                            "REQUEST_TOO_LARGE"
                          ]
                        },
                        "retrieval": {
                          "const": "NOT_ATTEMPTED"
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "415": {
            "description": "UNSUPPORTED_MEDIA_TYPE: only the pinned uncompressed UTF-8 JSON representation is accepted.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/RejectedAdmission"
                    },
                    {
                      "properties": {
                        "reason_code": {
                          "enum": [
                            "UNSUPPORTED_MEDIA_TYPE"
                          ]
                        },
                        "retrieval": {
                          "const": "NOT_ATTEMPTED"
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "422": {
            "description": "HANDOFF_CONTRACT_MISMATCH, CANDIDATE_RELEASE_MISMATCH, REFERENCE_MISMATCH, REMOTE_PRECONDITION_FAILED, INVENTORY_INVALID, BYTE_MISMATCH, CONTENT_INVALID, REMOTE_MUTATION or SNAPSHOT_FAILED. REJECTED retrieval only if intake began; otherwise NOT_ATTEMPTED. No accepted snapshot or later effect.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/RejectedAdmission"
                    },
                    {
                      "properties": {
                        "reason_code": {
                          "enum": [
                            "HANDOFF_CONTRACT_MISMATCH",
                            "CANDIDATE_RELEASE_MISMATCH",
                            "REFERENCE_MISMATCH",
                            "REMOTE_PRECONDITION_FAILED",
                            "INVENTORY_INVALID",
                            "BYTE_MISMATCH",
                            "CONTENT_INVALID",
                            "REMOTE_MUTATION",
                            "SNAPSHOT_FAILED"
                          ]
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/HTTP503"
          }
        }
      }
    },
    "/core-admission/0.2.0/admissions/{submission_id}": {
      "get": {
        "operationId": "read_admission",
        "summary": "Read or reconcile one Core-owned admission record",
        "description": "Authenticate and authorize readback for original caller namespace and exact submission/resource. Read only Core records/snapshot, never oCIS or either product service. A missing record is not retry permission. No implicit new request.",
        "parameters": [
          {
            "name": "submission_id",
            "in": "path",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/StableId"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authoritatively read original accepted or rejected record. No credential/private details.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/AcceptedAdmission"
                    },
                    {
                      "$ref": "#/components/schemas/RejectedAdmission"
                    }
                  ]
                }
              }
            }
          },
          "202": {
            "description": "Stored or observed uncertainty; no new intake.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UncertainAdmission"
                }
              }
            }
          },
          "404": {
            "description": "NOT_FOUND: no record visible to authorized caller; not proof of no prior effect.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MissingAdmission"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/HTTP400"
          },
          "401": {
            "$ref": "#/components/responses/HTTP401"
          },
          "403": {
            "$ref": "#/components/responses/HTTP403"
          },
          "503": {
            "$ref": "#/components/responses/HTTP503"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "CoreBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "opaque Core-issued access token",
        "description": "RFC 6750 Authorization header only; verified Core credential and independent operation/resource policy. No anonymous alternative."
      }
    },
    "schemas": {
      "StableId": {
        "type": "string",
        "minLength": 1,
        "maxLength": 128,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}(?![\\s\\S])",
        "not": {
          "anyOf": [
            {
              "pattern": "^(?:[Ll][Aa][Tt][Ee][Ss][Tt]|[Mm][Aa][Ii][Nn]|[Mm][Aa][Ss][Tt][Ee][Rr]|[Hh][Ee][Aa][Dd]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt]|[Ss][Tt][Aa][Bb][Ll][Ee]|[Dd][Ee][Ff][Aa][Uu][Ll][Tt])(?![\\s\\S])"
            },
            {
              "pattern": "\\.\\."
            }
          ]
        },
        "description": "Opaque, case-sensitive stable identity; never a path, URL, principal, secret or authority. No decoding, trimming, case folding, alias or mutable-selector resolution. Issuer stability and resource ownership require runtime verification."
      },
      "Sha256": {
        "type": "string",
        "minLength": 64,
        "maxLength": 64,
        "pattern": "^[0-9a-f]{64}(?![\\s\\S])"
      },
      "RequestedAt": {
        "type": "string",
        "minLength": 20,
        "maxLength": 20,
        "pattern": "^[1-9][0-9]{3}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z(?![\\s\\S])",
        "format": "date-time",
        "description": "RFC 3339 UTC whole-second subset (no leap seconds). Reject nonexistent calendar dates at runtime; format is annotation-only in the locked finite oracle. Audit time only, never authentication, replay identity or remote-version evidence."
      },
      "LaterEffects": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "assign_product_identity",
          "publish_product_object",
          "adopt_product",
          "update_projection"
        ],
        "properties": {
          "assign_product_identity": {
            "type": "string",
            "const": "NOT_ATTEMPTED"
          },
          "publish_product_object": {
            "type": "string",
            "const": "NOT_ATTEMPTED"
          },
          "adopt_product": {
            "type": "string",
            "const": "NOT_ATTEMPTED"
          },
          "update_projection": {
            "type": "string",
            "const": "NOT_ATTEMPTED"
          }
        }
      },
      "AdmissionRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "submission_id",
          "idempotency_key",
          "authenticated_request_context_id",
          "operation",
          "handoff_reference",
          "expected_candidate_id",
          "expected_candidate_manifest_sha256",
          "expected_candidate_contract_release_id",
          "requested_at"
        ],
        "properties": {
          "submission_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "authenticated_request_context_id": {
            "$ref": "#/components/schemas/StableId",
            "description": "Opaque Core-issued context handle. Core must resolve it and verify that it belongs to the independently authenticated current caller and is still valid. Merely supplying or guessing this handle never authenticates or authorizes the caller."
          },
          "operation": {
            "type": "string",
            "const": "admit_candidate"
          },
          "handoff_reference": {
            "$ref": "handoff-reference.schema.json"
          },
          "expected_candidate_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "expected_candidate_manifest_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "expected_candidate_contract_release_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "requested_at": {
            "$ref": "#/components/schemas/RequestedAt"
          }
        }
      },
      "AcceptedAdmission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "reason_code",
          "submission_id",
          "idempotency_key",
          "request_binding_sha256",
          "snapshot_id",
          "snapshot_sha256",
          "retrieval",
          "later_effects"
        ],
        "properties": {
          "status": {
            "type": "string",
            "const": "ACCEPTED"
          },
          "reason_code": {
            "type": "string",
            "const": "ADMITTED"
          },
          "submission_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "request_binding_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "snapshot_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "snapshot_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "retrieval": {
            "type": "string",
            "const": "SNAPSHOT_RECORDED"
          },
          "later_effects": {
            "$ref": "#/components/schemas/LaterEffects"
          }
        }
      },
      "RejectedAdmission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "reason_code",
          "retrieval",
          "later_effects"
        ],
        "properties": {
          "status": {
            "type": "string",
            "const": "REJECTED"
          },
          "reason_code": {
            "type": "string",
            "enum": [
              "INVALID_REQUEST",
              "REQUEST_TOO_LARGE",
              "UNSUPPORTED_MEDIA_TYPE",
              "UNAUTHENTICATED",
              "FORBIDDEN",
              "CONTEXT_MISMATCH",
              "HANDOFF_CONTRACT_MISMATCH",
              "CANDIDATE_RELEASE_MISMATCH",
              "REFERENCE_MISMATCH",
              "IDEMPOTENCY_CONFLICT",
              "REMOTE_PRECONDITION_FAILED",
              "INVENTORY_INVALID",
              "BYTE_MISMATCH",
              "CONTENT_INVALID",
              "REMOTE_MUTATION",
              "SNAPSHOT_FAILED",
              "UNAVAILABLE"
            ]
          },
          "retrieval": {
            "type": "string",
            "enum": [
              "NOT_ATTEMPTED",
              "REJECTED"
            ]
          },
          "later_effects": {
            "$ref": "#/components/schemas/LaterEffects"
          }
        },
        "allOf": [
          {
            "anyOf": [
              {
                "properties": {
                  "reason_code": {
                    "enum": [
                      "REMOTE_PRECONDITION_FAILED",
                      "INVENTORY_INVALID",
                      "BYTE_MISMATCH",
                      "CONTENT_INVALID",
                      "REMOTE_MUTATION",
                      "SNAPSHOT_FAILED",
                      "UNAVAILABLE"
                    ]
                  }
                }
              },
              {
                "properties": {
                  "retrieval": {
                    "const": "NOT_ATTEMPTED"
                  }
                }
              }
            ]
          }
        ]
      },
      "UncertainAdmission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "reason_code",
          "submission_id",
          "idempotency_key",
          "request_binding_sha256",
          "retrieval",
          "later_effects"
        ],
        "properties": {
          "status": {
            "type": "string",
            "const": "UNCERTAIN"
          },
          "reason_code": {
            "type": "string",
            "const": "RECONCILIATION_REQUIRED"
          },
          "submission_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "request_binding_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "retrieval": {
            "type": "string",
            "const": "UNCERTAIN"
          },
          "later_effects": {
            "$ref": "#/components/schemas/LaterEffects"
          }
        }
      },
      "MissingAdmission": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "reason_code",
          "retrieval",
          "later_effects"
        ],
