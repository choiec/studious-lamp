    "/internal/duckdbd/0.1.0/operations/{idempotency_key}": {
      "get": {
        "operationId": "read_duckdbd_operation",
        "summary": "Read back and reconcile the service-owned outcome",
        "description": "Authenticate current Core peer and independently authorize readback for the original caller namespace, operation and product; read only this service own durable operation record and storage. Recompute result/result digest on readback. No retry or other service call. NOT_FOUND is uncertainty, never proof of no effect.",
        "parameters": [
          {
            "name": "idempotency_key",
            "in": "path",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/StableId"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authoritative terminal result readback.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/Succeeded"
                    },
                    {
                      "$ref": "#/components/schemas/Failed"
                    }
                  ]
                }
              }
            }
          },
          "202": {
            "description": "Still unresolved; retain uncertainty.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Uncertain"
                }
              }
            }
          },
          "404": {
            "description": "NOT_FOUND: authoritative absence/no-pending-writer must still be established before retry.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MissingRecord"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/HTTP400"
          },
          "403": {
            "$ref": "#/components/responses/HTTP403"
          },
          "503": {
            "$ref": "#/components/responses/HTTP503"
          }
        }
      }
    }
