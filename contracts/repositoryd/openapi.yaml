    "/internal/repositoryd/0.1.0/operations/{idempotency_key}": {
      "get": {
        "operationId": "read_repositoryd_operation",
        "summary": "Read back and reconcile the service-owned outcome",
        "description": "Authenticate current Core peer and independently authorize readback for the original caller namespace, operation and product; read only this service own durable operation record and storage. Recompute result/result digest on readback. No retry or other service call. NOT_FOUND is uncertainty, never proof of no effect.",
        "parameters": [
          {
            "name": "idempotency_key",
            "in": "path",
            "required": true,
            "schema": {
              "$ref": "#/components/schemas/StableId"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authoritative terminal result readback.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/Succeeded"
                    },
                    {
                      "$ref": "#/components/schemas/Failed"
                    }
                  ]
                }
              }
            }
          },
          "202": {
            "description": "Still unresolved; retain uncertainty.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Uncertain"
                }
              }
            }
          },
          "404": {
            "description": "NOT_FOUND: authoritative absence/no-pending-writer must still be established before retry.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/NoStore"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MissingRecord"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/HTTP400"
          },
          "403": {
            "$ref": "#/components/responses/HTTP403"
          },
          "503": {
            "$ref": "#/components/responses/HTTP503"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "CoreServiceMTLS": {
        "type": "mutualTLS",
        "description": "TLS 1.3 mutually verified Core service certificate plus independent exact operation/product authorization; protected deployment bindings not included."
      }
    },
    "schemas": {
      "StableId": {
        "type": "string",
        "minLength": 1,
        "maxLength": 128,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}(?![\\s\\S])",
        "not": {
          "anyOf": [
            {
              "pattern": "^(?:[Ll][Aa][Tt][Ee][Ss][Tt]|[Mm][Aa][Ii][Nn]|[Mm][Aa][Ss][Tt][Ee][Rr]|[Hh][Ee][Aa][Dd]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt]|[Ss][Tt][Aa][Bb][Ll][Ee]|[Dd][Ee][Ff][Aa][Uu][Ll][Tt])(?![\\s\\S])"
            },
            {
              "pattern": "\\.\\."
            }
          ]
        },
        "description": "Opaque, case-sensitive stable identity; never a path, URL, principal, secret or authority. No decoding, trimming, case folding, alias or mutable-selector resolution. Issuer stability and resource ownership require runtime verification."
      },
      "Sha256": {
        "type": "string",
        "minLength": 64,
        "maxLength": 64,
        "pattern": "^[0-9a-f]{64}(?![\\s\\S])"
      },
      "CoreRecord": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "admission_record_id",
          "admission_record_sha256",
          "snapshot_id",
          "snapshot_sha256",
          "product_id",
          "identity_record_id",
          "identity_record_sha256"
        ],
        "properties": {
          "admission_record_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "admission_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "snapshot_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "snapshot_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "product_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "identity_record_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "identity_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          }
        },
        "description": "Core-owned accepted-admission/snapshot and separately assigned product identity references; no Candidate intake locator or authority. Service checks consistency with the authenticated Core request and immutable local bindings. Candidate ID is never a substitute product identity."
      },
      "PublishRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "effect_id",
          "idempotency_key",
          "authenticated_request_context_id",
          "policy_revision",
          "core_record",
          "core_record_sha256",
          "operation",
          "object_size_bytes",
          "object_sha256",
          "object_bytes_base64"
        ],
        "properties": {
          "effect_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "idempotency_key": {
            "$ref": "#/components/schemas/StableId"
          },
          "authenticated_request_context_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "policy_revision": {
            "$ref": "#/components/schemas/StableId"
          },
          "core_record": {
            "$ref": "#/components/schemas/CoreRecord"
          },
          "core_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "operation": {
            "type": "string",
            "const": "publish_product_object"
          },
          "object_size_bytes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 67108864
          },
          "object_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "object_bytes_base64": {
            "type": "string",
            "minLength": 4,
            "maxLength": 89478488,
            "pattern": "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?(?![\\s\\S])",
            "description": "Canonical RFC 4648 padded base64, no whitespace. Decode strictly, check pad bits by re-encoding, then recompute exact size/SHA-256; at most 64 MiB decoded. Bytes are Core-produced canonical product object material derived solely from its verified snapshot; never a command, path, Handoff intake or executable archive. Store as opaque immutable bytes; do not execute, extract or fetch embedded locators."
          }
        }
      },
      "Result": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "product_id",
          "core_record_sha256",
          "object_size_bytes",
          "object_sha256"
        ],
        "properties": {
          "product_id": {
            "$ref": "#/components/schemas/StableId"
          },
          "core_record_sha256": {
            "$ref": "#/components/schemas/Sha256"
          },
          "object_size_bytes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 67108864
          },
          "object_sha256": {
            "$ref": "#/components/schemas/Sha256"
          }
        }
      },
